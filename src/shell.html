<title>Ko'ox Maaya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Curso de maya yucateco (maaya t'aan) desde cero, en español: lecciones cortas, repaso espaciado y diccionario.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Ko'ox Maaya">
<meta name="theme-color" content="" id="meta-theme">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="gfonts" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" media="print">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap"></noscript>
<style>
/*@@CSS@@*/
</style>

<div class="app" id="app" lang="es">
  <noscript><p class="noscript">Ko'ox Maaya necesita JavaScript para funcionar.</p></noscript>

  <!-- Pestañas principales -->
  <main id="tabs-main">
    <section class="view" id="v-home" aria-labelledby="home-title"></section>
    <section class="view" id="v-review" aria-labelledby="review-title" hidden></section>
    <section class="view" id="v-dict" aria-labelledby="dict-title" hidden>
      <header class="page-head">
        <p class="eyebrow">Todas las palabras del curso</p>
        <h1 id="dict-title">Diccionario</h1>
      </header>
      <div id="dict-guide"></div>
      <form class="search" id="dict-form" role="search">
        <label class="sr-only" for="dict-q">Buscar en maya o en español</label>
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input id="dict-q" type="search" placeholder="Buscar en maya o en español" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button class="icon-btn search-clear" id="dict-clear" type="button" aria-label="Borrar búsqueda" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
      </form>
      <div class="chips" id="dict-units" role="group" aria-label="Filtrar por unidad"></div>
      <p class="dict-count" id="dict-count" aria-live="polite"></p>
      <ul class="dict-list" id="dict-list"></ul>
    </section>
    <section class="view" id="v-profile" aria-labelledby="profile-title" hidden></section>
  </main>

  <!-- Sesión: lección, repaso o práctica (pantalla completa) -->
  <section class="session" id="v-session" hidden aria-label="Sesión de estudio">
    <div class="s-top" id="s-top">
      <button class="icon-btn" id="btn-close" type="button" aria-label="Salir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="s-progress" id="s-progress" role="progressbar" aria-label="Avance de la sesión" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="s-progress-fill"></span></div>
      <span class="s-count num" id="s-count"></span>
    </div>
    <div class="s-body" id="s-body"></div>
    <div class="s-actions" id="s-actions">
      <div class="s-actions-inner">
        <button class="btn primary wide" id="btn-next" type="button" hidden>Siguiente</button>
        <button class="btn primary wide" id="btn-check" type="button" disabled hidden>Comprobar</button>
      </div>
    </div>
    <p class="sr-only" id="fb-live" role="status" aria-live="polite"></p>
    <div class="sheet" id="feedback" hidden>
      <div class="sheet-inner">
        <div class="fb-body" id="fb-body"></div>
        <button class="btn wide" id="btn-continue" type="button" aria-describedby="fb-body">Continuar</button>
      </div>
    </div>
  </section>

  <!-- Hoja de vista previa de lección -->
  <div class="overlay bottom-sheet" id="lesson-sheet" hidden>
    <div class="scrim" data-close-sheet></div>
    <div class="modal bottom" role="dialog" aria-modal="true" aria-labelledby="ls-title" id="ls-modal"></div>
  </div>

  <!-- Confirmación dentro de la página -->
  <div class="overlay" id="confirm" hidden>
    <div class="scrim" data-confirm-stay></div>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <h2 id="confirm-title">¿Salir de la lección?</h2>
      <p id="confirm-text">Perderás el avance de esta sesión. Lo que ya aprendiste en otras lecciones se queda guardado.</p>
      <div class="modal-actions">
        <button class="btn primary wide" id="btn-confirm-stay" type="button" data-confirm-stay>Seguir aprendiendo</button>
        <button class="btn ghost-danger wide" id="btn-confirm-exit" type="button">Salir</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<nav class="navbar" id="navbar" aria-label="Secciones" lang="es">
  <div class="navbar-inner">
    <button class="nav-tab" type="button" data-tab="aprender" id="tab-aprender">
      <span class="nav-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h4v-4h4v-4h4V8h4V4"/><path d="M3 20h18"/></svg></span>
      <span class="nav-label">Aprender</span>
    </button>
    <button class="nav-tab" type="button" data-tab="repasar" id="tab-repasar">
      <span class="nav-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg><span class="nav-badge num" id="nav-badge" aria-hidden="true" hidden></span></span>
      <span class="nav-label">Repasar</span>
    </button>
    <button class="nav-tab" type="button" data-tab="diccionario" id="tab-diccionario">
      <span class="nav-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/><path d="M9 8h5"/></svg></span>
      <span class="nav-label">Diccionario</span>
    </button>
    <button class="nav-tab" type="button" data-tab="perfil" id="tab-perfil">
      <span class="nav-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
      <span class="nav-label">Perfil</span>
    </button>
  </div>
</nav>

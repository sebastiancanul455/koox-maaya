  // «Completa la frase» (escrito a mano, confirmado) como «Arma la frase»: la frase entera en fichas y las
  // opciones incorrectas como distractores. Solo frases cortas con traducción.
  function fillToBuild(e) {
    var full = exTarget(e), ws = words(full).map(tileText).filter(Boolean);
    if (!e.es || e.conf !== "alta" || ws.length < 2 || ws.length > 7) return null;
    var inM = {}; ws.forEach(function (w) { inM[normalize(w)] = 1; });
    var ds = arr(e.options).map(tileText).filter(function (d) { return d && !inM[normalize(d)] && (inM[normalize(d)] = 1); });
    return { type: "build", hand: true, fromFill: true, es: e.es, m: full, words: ws, distractors: ds, vocab: e.vocab, conf: e.conf };
  }
  // Ejercicios de la lección. «pre» son las comprobaciones rápidas ya intercaladas entre las
  // palabras nuevas: cuentan dentro del total y no se repiten aquí.
  function lessonExercises(lesson, pre) {
    pre = pre || [];
    var hand = lesson.exercises.slice(0, 15).map(function (e) { var c = Object.assign({}, e); c.hand = true; return handToType(c, lesson) || c; });
    var V = lesson.vocab;
    var earlier = lesson.unit.lessons.slice(0, lesson.index).reduce(function (a, l) { return a.concat(l.vocab); }, []);
    var earlierCourse = COURSE.lessons.slice(0, lesson.order).reduce(function (a, l) { return a.concat(l.vocab); }, []);
    // Si ya hubo parejas como comprobación rápida, no se repiten aquí.
    var quickPairs = pre.some(function (e) { return e.type === "pairs"; });
    var pairs = V.length && !quickPairs ? makePairs(V, [earlier, earlierCourse]) : null;
    // No repite lo que ya pregunta un ejercicio escrito a mano o una comprobación intercalada.
    function autoKey(e) {
      if (e.type === "choice") return (e.promptLang === "m" ? "m2es:" + normalize(e.prompt) : "es2m:" + normalize(e.answer));
      if (e.type === "type") return "type:" + normalize(e.answer);
      if (e.type === "build") return "build:" + normalize(e.m);
      return "";
    }
    var handKeys = {}, handVocab = {};
    hand.concat(pre).forEach(function (e) {
      var k = autoKey(e); if (k) handKeys[k] = 1;
      if (e.vocab && (e.hand || e.type !== "choice")) handVocab[e.vocab.id] = 1;
    });
    // Primero reconocer, luego producir: cada palabra ya se vio en su tarjeta (y quizá en una comprobación
    // rápida), así que lo confirmado se escribe o se arma; lo «por confirmar» solo se reconoce.
    // Primero las palabras que no pregunta ya un ejercicio escrito a mano.
    var order = shuffle(V.slice()).sort(function (a, b) { return (handVocab[a.id] ? 1 : 0) - (handVocab[b.id] ? 1 : 0); });
    var main = order.map(function (v) {
      var e = makeProduce(v);
      if (e && !handKeys[autoKey(e)]) return e;
      var alt = e && e.type === "build" && canType(v) ? makeType(v) : e && e.type === "type" && canBuild(v) ? makeBuild(v) : null;
      if (alt && !handKeys[autoKey(alt)]) return alt;
      return makeChoice(v, "m2es") || makeChoice(v, "es2m");
    }).filter(function (e) { return e && !handKeys[autoKey(e)]; });
    // Segunda vuelta (lecciones con pocas palabras): la otra forma de producir y luego reconocer.
    var extra = order.map(function (v) { return canType(v) && canBuild(v) ? makeBuild(v) : null; })
      .concat(order.map(function (v) { return canType(v) && canBuild(v) ? makeType(v) : null; }), order.map(function (v) { return makeChoice(v, "m2es"); }))
      .filter(function (e) { return e && !handKeys[autoKey(e)]; });
    // 1 o 2 de «Escucha y elige» cuando hay voces nativas de las palabras de la lección.
    var listen = shuffle(V.filter(function (v) { return nativeFor(v); })).slice(0, 2).map(makeListen).filter(Boolean);
    var target = clamp(hand.length + V.length + 3, 10, 15);
    var need = Math.max(0, target - hand.length - pre.length - listen.length);
    var queue = (pairs ? [pairs] : []).concat(main, extra);
    // Sin alargar la lección: como mucho tantos ejercicios automáticos como permiten sus palabras (una
    // elección de reconocer y una de producir por palabra que no pregunte ya otro ejercicio, más parejas).
    var room = (V.length ? 1 : 0) - pre.filter(function (e) { return e.type === "pairs"; }).length;
    V.forEach(function (v) {
      var n = normalize(v.m);
      if (!handKeys["m2es:" + n] && makeChoice(v, "m2es")) room++;
      var es2m = !handKeys["es2m:" + n] && makeChoice(v, "es2m");
      // Antes se escribía la mitad de las palabras escribibles y la otra mitad se elegía en maya.
      if (canType(v) ? !handKeys["type:" + n] : es2m) room++;
      else if (canType(v) && es2m) room += 0.5;
    });
    need = Math.min(need, Math.max(0, Math.round(room)));
    var seenKey = {};
    var auto = queue.filter(function (e) { var k = autoKey(e); if (k && seenKey[k]) return false; if (k) seenKey[k] = 1; return true; }).slice(0, need);
    // Repaso breve dentro de la lección: producir palabras confirmadas de lecciones anteriores (primero de
    // la unidad) cuando las de esta lección ya se producen en otro ejercicio o no alcanzan.
    var back = shuffle(earlier.slice()).concat(shuffle(earlierCourse.slice(-40))).filter(function (x) { return canType(x) || canBuild(x); });
    function fresh(nx) { return nx && !handKeys[autoKey(nx)] && !seenKey[autoKey(nx)] ? nx : null; }
    function produceFresh(v) {
      var nx = makeProduce(v);
      return fresh(nx) || (canType(v) && canBuild(v) ? fresh(nx && nx.type === "type" ? makeBuild(v) : makeType(v)) : null);
    }
    function produceBack() { var nx = null; while (!nx && back.length) nx = produceFresh(back.shift()); return nx; }
    while (auto.length < need) {
      var nb = produceBack();
      if (!nb) break;
      seenKey[autoKey(nb)] = 1; auto.push(nb);
    }
    // Elegir opción (elecciones y completar con opciones) es como mucho el 40 % de la lección: si se pasa,
    // se cambian por producción, primero las elecciones automáticas de palabras confirmadas y las de
    // palabras «por confirmar» que ya se reconocen en otro ejercicio; luego los «completa la frase»
    // escritos a mano (pasan a «arma la frase» con las opciones como distractores).
    // Las elecciones escritas a mano y la única comprobación de lo «por confirmar» se quedan: puede quedar por encima.
    function isPick(e) { return e.type === "choice" || e.type === "fill"; }
    var total = hand.length + pre.length + auto.length + listen.length;
    var picks = hand.concat(pre, auto).filter(isPick).length;
    var recog = {};
    hand.concat(pre).forEach(function (e) {
      if (e.type === "choice" && e.vocab) recog[e.vocab.id] = 1;
      if (e.type === "pairs") e.items.forEach(function (x) { recog[x.id] = 1; });
    });
    function swap(arrX, mk) {
      for (var i = 0; i < arrX.length && picks > PICK_MAX * total; i++) {
        var nx = isPick(arrX[i]) ? mk(arrX[i]) : null;
        if (nx && !handKeys[autoKey(nx)] && !seenKey[autoKey(nx)]) { seenKey[autoKey(nx)] = 1; arrX[i] = nx; picks--; }
      }
    }
    swap(auto, function (e) {
      if (e.type !== "choice" || !e.vocab || e.vocab.conf !== "alta") return null;
      return produceFresh(e.vocab) || produceBack();
    });
    swap(auto, function (e) { return e.type === "choice" && e.vocab && recog[e.vocab.id] ? produceBack() : null; });
    swap(hand, function (e) { return e.type === "fill" ? fillToBuild(e) : null; });
    // Fases: reconocer -> relacionar -> producir.
    var all = hand.concat(auto, listen);
    function phase(e) {
      if (e.type === "choice" && e.promptLang === "m") return 0;
      if (e.type === "pairs" || e.type === "fill" || e.type === "choice" || e.type === "listen") return 1;
      return 2;
    }
    var buckets = [[], [], []];
    all.forEach(function (e) { buckets[phase(e)].push(e); });
    return shuffle(buckets[0]).concat(shuffle(buckets[1]), shuffle(buckets[2]));
  }
  function wordExercises(list, max, withPairs, pairPool) {
    // Nivel 2 o más: la palabra ya se reconoce, así que se produce (escribir o armar). En nivel 0–1 se
    // reconoce mientras las elecciones no pasen del 30 % de lo armado hasta ahí (las de palabras «por
    // confirmar», que solo se reconocen, también cuentan); lo demás se produce.
    var out = [], picks = 0;
    list.slice(0, max).forEach(function (v) {
      var r = state.srs[v.id], e = null;
      if ((!r || r.box < 2) && picks < Math.floor(0.3 * (out.length + 1))) e = makeChoice(v, "m2es");
      if (!e) e = makeProduce(v) || makeChoice(v, "m2es") || makeChoice(v, "es2m");
      if (e) { out.push(e); if (e.type === "choice") picks++; }
    });
    // En los repasos también: hasta 2 de «Escucha y elige» con las palabras que tienen voz nativa.
    for (var i = 0, nl = 0; i < out.length && nl < 2; i++) {
      var le = out[i].vocab && nativeFor(out[i].vocab) ? makeListen(out[i].vocab) : null;
      if (le) { out[i] = le; nl++; }
    }
    if (withPairs) {
      var p = makePairs(list.slice(0, 8), [pairPool || COURSE.vocab]);
      if (p) out.splice(Math.min(2, out.length), 0, p);
    }
    return out;
  }

  /* ================= Sesión ================= */
  var S = null;     // sesión activa
  var cur = null;   // ejercicio en pantalla

  function openSession(kind, steps, extra) {
    closeLessonSheet(true, "keep");
    histPush("s");
    S = Object.assign({ kind: kind, steps: steps, idx: 0, firstTotal: 0, firstRight: 0, moved: 0, pending: {}, done: false }, extra || {});
    cur = null;
    document.body.classList.add("in-session");
    el.main.hidden = true;
    el.session.hidden = false;
    el.close.setAttribute("aria-label", kind === "lesson" ? "Salir de la lección" : "Salir del repaso");
    renderStep();
  }
  // Grupos de 3 o 4 palabras nuevas; tras cada grupo, una comprobación rápida de reconocimiento.
  function vocabChunks(V) {
    if (V.length <= 4) return V.length ? [V.slice()] : [];
    var k = Math.ceil(V.length / 4), base = Math.floor(V.length / k), rem = V.length % k, out = [], at = 0;
    for (var i = 0; i < k; i++) { var n = base + (i < rem ? 1 : 0); out.push(V.slice(at, at + n)); at += n; }
    return out;
  }
  function startLesson(l) {
    if (!l) return;
    openSession("lesson", lessonSteps(l), { lesson: l });
  }
  function lessonSteps(l) {
    var steps = [], pre = [];
    l.teach.forEach(function (c) { steps.push({ t: "teach", card: c }); });
    var handPrompts = {};
    l.exercises.forEach(function (e) { if (e.type === "choice" && e.promptLang === "m") handPrompts[normalize(e.prompt)] = 1; });
    var i = 0, shown = [];
    vocabChunks(l.vocab).forEach(function (chunk, ci) {
      chunk.forEach(function (v) { steps.push({ t: "vocab", v: v, i: i++, n: l.vocab.length }); });
      // Tras el primer grupo, la comprobación es emparejar el grupo nuevo con lo ya visto en la lección
      // (al menos 2 palabras del grupo y solo formas confirmadas); si no alcanza, una elección.
      var qp = ci > 0 ? makePairs(chunk, [shown]) : null;
      shown = shown.concat(chunk);
      if (qp && qp.items.filter(function (x) { return chunk.indexOf(x) >= 0; }).length >= 2) {
        qp.quick = true; pre.push(qp); steps.push({ t: "ex", ex: qp }); return;
      }
      var cands = shuffle(chunk.filter(function (v) { return !handPrompts[normalize(v.m)]; }));
      for (var c = 0; c < cands.length; c++) {
        var e = makeChoice(cands[c], "m2es");
        if (e) { e.quick = true; pre.push(e); steps.push({ t: "ex", ex: e }); break; }
      }
    });
    if (l.dialogue) steps.push({ t: "dialogue", d: l.dialogue });
    lessonExercises(l, pre).forEach(function (e) { steps.push({ t: "ex", ex: e }); });
    return steps;
  }
  // Ejercicios del repaso general: vencidas o, si nada vence, práctica libre con las más débiles.
  function reviewExercises() {
    var due = dueList(), kind = "review", list;
    if (due.length) list = due.slice(0, 15).map(function (e) { return e.v; });
    else { kind = "practice"; list = weakList().slice(0, 12).map(function (e) { return e.v; }); }
    return { kind: kind, words: list.length, exs: list.length ? wordExercises(shuffle(list), 15, false) : [] };
  }
  function startReview() {
    var r = reviewExercises();
    if (!r.words) { toast("Completa una lección para empezar a repasar."); return; }
    if (!r.exs.length) { toast("Aún no hay suficientes palabras para repasar."); return; }
    openSession(r.kind, r.exs.map(function (e) { return { t: "ex", ex: e }; }));
  }
  function unitStarted(u) { return u.lessons.some(lessonDone); }
  // Solo palabras que ya se estudiaron: nunca se repasa lo que no se ha enseñado.
  function unitReviewExercises(u) {
    var studied = u.vocab.filter(function (v) { return state.srs[v.id]; });
    if (!studied.length) return { words: 0, exs: [] };
    var list = shuffle(studied.slice()).sort(function (a, b) { return state.srs[a.id].box - state.srs[b.id].box; }).slice(0, 12);
    return { words: list.length, exs: wordExercises(shuffle(list), 12, true, srsEntries().map(function (e) { return e.v; })) };
  }
  function startUnitReview(u) {
    var r = unitReviewExercises(u);
    if (!r.words) { toast("Completa una lección de esta unidad para repasarla."); return; }
    if (!r.exs.length) { toast("Esta unidad aún no tiene palabras para repasar."); return; }
    openSession("unit", r.exs.map(function (e) { return { t: "ex", ex: e }; }), { unit: u });
  }

  function exStepsBefore(i) { var n = 0; for (var k = 0; k < i; k++) if (S.steps[k].t === "ex") n++; return n; }
  function updateProgress() {
    var total = S.steps.length, pct = total ? Math.round(S.idx / total * 100) : 100;
    el.fill.style.width = pct + "%";
    el.progress.setAttribute("aria-valuenow", String(pct));
    var st = S.steps[S.idx];
    if (st && st.t === "ex") {
      var exTotal = S.steps.filter(function (s) { return s.t === "ex"; }).length;
      el.count.textContent = (exStepsBefore(S.idx) + 1) + "/" + exTotal;
    } else el.count.textContent = "";
  }
  function bumpBar() {
    el.progress.classList.remove("bump");

    el.progress.classList.add("bump");
  }
  function setSheetHeight() {
    var h = el.feedback.hidden ? el.actions.offsetHeight : Math.max(el.actions.offsetHeight, el.feedback.offsetHeight);
    document.body.style.setProperty("--sheet-h", (h || 96) + "px");

  function renderStep() {

    if (el.live) el.live.textContent = "";

    var st = S.steps[S.idx];
    if (!st) { finishSession(); return; }
    updateProgress();
    cur = null;
    el.next.hidden = st.t === "ex";
    el.check.hidden = st.t !== "ex";
    el.check.disabled = true;
    el.check.textContent = "Comprobar";
    el.next.textContent = "Siguiente";
    if (st.t === "teach") { renderTeach(st.card); screen = "teach"; }
    else if (st.t === "vocab") { renderVocab(st); screen = "vocab"; }
    else if (st.t === "dialogue") { renderDialogue(st.d); screen = "dialogue"; }

    window.scrollTo(0, 0);
  }

  /* ---------- Tarjetas y vocabulario ---------- */
  function renderTeach(c) {

        head.map(function (x) { return '<th scope="col">' + esc(x) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        arr(c.rows).map(function (r) {

  function confBadge(v) {

  function renderVocab(st) {

  // Inicial del avatar: salta tratamientos (Don, Doña, Dra., Sr.…) para que «Dra. Pat» y
  // «Don Felipe» no compartan la misma letra.

    var rest = words.filter(function (w) { return !/^(don|doña|dona|dr|dra|sr|sra|srta|lic|ing|prof|profa)\.?$/i.test(w); });
    var w = (rest.length ? rest : words)[0] || "?";
    return w.charAt(0).toUpperCase();
  }
  function renderDialogue(d) {
    var lines = "", used = {};
    d.lines.forEach(function (ln, i) {
      var name = ln.name || (ln.who === "A" ? "A" : "B"), la = audioForText(ln.m);
      if (la) used[la.kind] = 1;
      lines += '<div class="bubble-row ' + (ln.who === "B" ? "b" : "a") + '" style="animation-delay:' + (i * 60) + 'ms">' +

        '<button class="bubble" type="button" aria-expanded="false" id="line-' + i + '">' +

        (la && la.kind === "sintetico" ? '<span class="tr-au" data-au-key="' + esc(la.key) + '">' + esc(AU_KIND.sintetico.label) + "</span>" : "") +
        '<span class="tr" hidden>' + esc(ln.es) + '</span><span class="tr-hint">Toca para traducir</span></button>' +
        (la ? auBtn(la, ln.m, "md", "line-au-" + i) : "") + "</div>";
    });

  // Alta de una palabra en el repaso (la usan las lecciones y los módulos). Devuelve true si es nueva.

  // Siempre entra en nivel 1 y vence en la fecha dada (la lección pasa mañana).
  function srsEnroll(id, due, p) {
    if (state.srs[id]) return false;
    p = p || {};
    var g = p.wrong > 0 ? 1 : 3, m = FSRS.init(g);
    state.srs[id] = { box: 1, due: due, right: nonNeg(p.right), wrong: nonNeg(p.wrong), s: m.s, d: m.d, last: today(), reps: 1, lapses: 0 };
    FSRS.record(id, g);
    return true;
  }
  function finishSession() {
    var s = S;

    var xp = 0, newWords = [], h = "";

      var l = s.lesson;
      xp = 10 + right + (total && pct === 100 ? 5 : 0);
      var rec = state.lessons[l.id] || { best: 0, done: false, times: 0 };
      rec.best = Math.max(rec.best, pct); rec.done = true; rec.times++;
      state.lessons[l.id] = rec;
      var tomorrow = addDays(today(), 1);
      l.vocab.forEach(function (v) {
        var p = s.pending[v.id] || { right: 0, wrong: 0 };
        if (!state.srs[v.id]) { srsEnroll(v.id, tomorrow, p); newWords.push(v); }
        else if (state.srs[v.id].box === 0) { state.srs[v.id].box = 1; state.srs[v.id].due = tomorrow; }
      });
    } else {
      xp = right + (total ? 5 : 0);

    addXP(xp);

      (s.kind === "lesson" ? '<div class="res-stat"><span class="v num">' + newWords.length + '</span><span class="l">' + plural(newWords.length, "Palabra nueva", "Nuevas") + "</span></div>"

  /* ---------- Historial: el botón Atrás de Android ---------- */
  // La sesión y la hoja de lección empujan una entrada (misma URL). Atrás la quita: en una
  // lección abierta pide confirmar la salida, en la hoja o el diálogo los cierra.
  var histPending = null;
  function histState() { try { return history.state && history.state.koox || null; } catch (e) { return null; } }
  function histPush(kind) {
    try {
      if (histState()) history.replaceState({ koox: kind }, "");
      else history.pushState({ koox: kind }, "");
    } catch (e) { /* marco sin historial */ }
  }
  function histPop(cb) {
    if (!histState()) { cb(); return; }
    var done = false;
    var run = function () { if (done) return; done = true; histPending = null; cb(); };

    try { history.back(); } catch (e) { run(); return; }
    setTimeout(run, 400);
  }

  function dictMatches(q, unitId) {
    var k = searchKey(q);
    var list = COURSE.vocab.filter(function (v) { return unitId === "all" || v.unit.id === unitId; });
    if (!k) return list;
    var scored = [];
    list.forEach(function (v, i) {
      var best = 9;
      var keys = v.km.concat([v.kes], v.kes.split(/\s+/));
      keys.forEach(function (key) {
        if (!key) return;
        var s = key === k ? 0 : key.indexOf(k) === 0 ? 1 : (" " + key).indexOf(" " + k) >= 0 ? 2 : key.indexOf(k) >= 0 ? 3 : 9;
        if (s < best) best = s;
      });
      if (best < 9) scored.push({ v: v, s: best, i: i });
    });
    scored.sort(function (a, b) { return a.s - b.s || a.i - b.i; });
    return scored.map(function (x) { return x.v; });

    if (typeof o.v === "number" && o.v > 2) return "Esa copia es de una versión más nueva de Ko'ox Maaya. Actualiza la app y vuelve a intentarlo.";
    if (o.v !== 2 || !isObj(o.lessons) || !isObj(o.srs)) return NOT_BACKUP;

    if (L.dirty) { updateBadge(); showTab(tab, { keepScroll: true }); }   // el inicio muestra los repasos y el XP al día
    var b = $("#btn-home-readings");

  }
  function goBack() {
    if (L.sheet) closeSheet();

  }
  window.addEventListener("popstate", function () {
    if (!L.open) return;
    if (L.sheet) { closeSheet(); histPush("lec"); return; }

  });
  document.addEventListener("visibilitychange", function () {
    if (L.open && document.visibilityState === "visible") screen = L.view === "reader" ? "lector" : "lecturas";

  function topHTML(label, crumb) {
    return '<div class="lec-top"><button class="icon-btn" type="button" data-act="back" aria-label="' + esc(label) + '">' + IC.back + "</button>" +

  /* ---------- Lista ---------- */
  function cardHTML(r) {
    var c = coverage(r), d = doneOf(r.id);

      '<span class="lec-card-meta">' + r.nLines + " " + plural(r.nLines, "línea", "líneas") + (r.pages.length > 1 ? " · " + r.pages.length + " páginas" : "") + "</span>" +
      '<span class="lec-cov">' + covText(c) + "</span>" +

  function listHTML() {

    if (!rs.length) return h + '<div class="card empty-state"><h2>Aún no hay lecturas</h2><p class="muted">Cuando el curso tenga diálogos, aparecerán aquí.</p></div></div>';
    var groups = [["Diálogos del curso", rs.filter(function (r) { return r.kind === "curso"; })], ["Cuentos y textos de otras fuentes", rs.filter(function (r) { return r.kind !== "curso"; })]]
      .filter(function (g) { return g[1].length; });
    h += '<p class="lec-count muted">' + rs.length + " " + plural(rs.length, "lectura", "lecturas") + " · " + nDone + " " + plural(nDone, "leída", "leídas") + "</p>";
    groups.forEach(function (g) {

  function showList(focusId) {

  /* ---------- Lector ---------- */
  function openReader(id) {
    var r = byId(id);

  }
  function sourceHTML(r) {
    if (r.kind === "curso") return "Fuente: diálogo de este curso (Unidad " + r.unit.n + ", lección " + (r.lesson.index + 1) + ")";
    var s = r.source, parts = [s.name].concat(s.credit ? [s.credit] : [], s.license ? [s.license] : []);
    return "Fuente: " + esc(parts.join(" · ")) + (s.url ? ' · <a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">Ver fuente<span class="sr-only"> (se abre fuera de la app)</span></a>' : "");
  }
  // Una palabra o frase es un botón. Las que el curso no tiene (o aún no conoces) se distinguen por su fondo y su subrayado.
  function wordHTML(s, i, j) {
    var known = unitKnown(s), cls = "lec-w" + (s.items ? "" : " ng") + (known ? "" : " unk");
    var aria = s.text + (s.items ? ", ver significado" + (known ? "" : ", palabra nueva") : ", sin glosa en el curso");
    // lang="es": el aria-label está en español aunque el texto de la línea sea maya (el span interior lleva lang="yua").
    return '<button class="' + cls + '" type="button" lang="es" data-act="word" data-i="' + i + '" data-j="' + j + '" aria-haspopup="dialog" aria-label="' + esc(aria) + '">' +
      '<span class="m" lang="yua">' + esc(s.text) + "</span></button>";
  }
  function rowHTML(ln, i, a) {
    var side = ln.who === "B" ? "b" : ln.who === "A" ? "a" : "p";
    var text = segs(ln).map(function (s, j) { return s.w ? wordHTML(s, i, j) : esc(s.text); }).join("");
    return '<div class="bubble-row lec-row ' + side + '" data-i="' + i + '">' +
      (ln.who ? '<span class="avatar" aria-hidden="true">' + esc(initialOf(ln.name || ln.who)) + "</span>" : "") +
      '<div class="bubble lec-bubble">' + (ln.name ? '<span class="who">' + esc(ln.name) + "</span>" : "") +
      '<p class="lec-text m" lang="yua">' + text + "</p>" +
      '<p class="lec-tr"' + (transOn() ? "" : " hidden") + ">" + esc(ln.es) + "</p></div>" +
      (a ? auBtn(a, ln.m, "md") : "") + "</div>";
  }
  function readerHTML() {
    var r = L.r, pg = r.pages[L.page], np = r.pages.length, last = L.page === np - 1, used = {}, anyAu = false;
    var rows = pg.lines.map(function (ln, i) {
      var a = audioForText(ln.m);
      if (a) { used[a.kind] = 1; anyAu = true; }
      return rowHTML(ln, i, a);
    }).join("");
    var d = doneOf(r.id);
    var h = topHTML("Volver a la lista de lecturas", "Lecturas") + '<div class="lec-main">' +
      '<header class="page-head lec-head"><p class="eyebrow">' + (r.kind === "curso" ? "Unidad " + r.unit.n + " · Lección " + (r.lesson.index + 1) : "Lectura") + "</p>" +
      '<h1 id="lec-h" tabindex="-1">' + markMaya(r.title) + "</h1>" +
      '<p class="lec-source">' + sourceHTML(r) + "</p>" +
      '<p class="lec-cov" id="lec-cov">' + covText(coverage(r)) + "</p></header>" +
      '<div class="settings"><label class="setting" for="lec-trans"><span class="setting-txt">Mostrar traducción<small>Debajo de cada línea</small></span>' +
      '<input class="switch" type="checkbox" role="switch" id="lec-trans"' + (transOn() ? " checked" : "") + "></label></div>";
    if (anyAu) h += '<button class="btn tonal wide" type="button" id="lec-follow" data-act="follow">' + ICON.speaker + "Escucha y sigue</button>";
    h += '<p class="lec-hint muted">Toca una palabra para ver su significado' + (anyAu ? " y una línea para escucharla" : "") + ".</p>";
    if (anyAu) h += auNote(used, "Audio: ");
    h += '<div class="dialogue lec-lines" id="lec-lines">' + rows + "</div>";
    if (np > 1) h += '<nav class="lec-pager" aria-label="Páginas de la lectura"><button class="btn ghost" type="button" data-act="prev"' + (L.page ? "" : " disabled") + ">Anterior</button>" +
      '<span class="num lec-pg" aria-live="polite">Página ' + (L.page + 1) + " de " + np + "</span>" +
      '<button class="btn ghost" type="button" data-act="next"' + (last ? " disabled" : "") + ">Siguiente</button></nav>";
    if (last) h += '<button class="btn primary wide" type="button" id="lec-finish" data-act="finish">Terminé de leer</button>' +
      (d ? '<p class="lec-done muted">Ya la leíste ' + d.n + " " + plural(d.n, "vez", "veces") + ".</p>" : "");
    return h + "</div>";
  }
  function renderReader() {
    stopFollow(true); closeSheet(true);
    var r = L.r;
    L.lines = r.pages[L.page].lines;
    L.root.innerHTML = '<div class="lec-wrap">' + readerHTML() + "</div>";
    screen = "lector";
    L.root.scrollTop = 0;
    var h = $("#lec-h", L.root);
    if (h) h.focus({ preventScroll: true });
  }
  function turnPage(d) {
    var np = L.r.pages.length, p = clamp(L.page + d, 0, np - 1);
    if (p === L.page) return;
    stopAudio(); L.page = p; renderReader();
  }
  function applyTrans() {
    var on = transOn();
    $$(".lec-tr", L.root).forEach(function (p) { p.hidden = !on; });
  }
  function onChange(e) {
    var t = e.target;
    if (t && t.id === "lec-trans") { mine().trans = !!t.checked; save(); applyTrans(); }
  }
  // «Terminé de leer»: lo anota; la primera vez de cada lectura da XP (el modo tranquilo ya oculta el XP).
  function finish() {
    var r = L.r;
    if (!r) return;
    var x = mine(), prev = x.done[r.id];
    x.done[r.id] = { n: (prev ? prev.n : 0) + 1, last: today() };
    if (!prev) addXP(XP_FIRST);
    save();
    L.dirty = true;
    toast("Lectura terminada");
    showList(r.id);
  }
  function rowEl(i) { return L.root ? $('.lec-row[data-i="' + i + '"]', L.root) : null; }
  // Tras guardar una palabra: su estado, el aria de cada palabra y el porcentaje al día.
  function refreshWords() {
    if (L.view !== "reader") return;
    $$(".lec-w", L.root).forEach(function (b) {
      var ln = L.lines[Number(b.getAttribute("data-i"))], s = ln && segs(ln)[Number(b.getAttribute("data-j"))];
      if (!s) return;
      var known = unitKnown(s);
      b.classList.toggle("unk", !known);
      b.setAttribute("aria-label", s.text + (s.items ? ", ver significado" + (known ? "" : ", palabra nueva") : ", sin glosa en el curso"));
    });
    var c = $("#lec-cov", L.root);
    if (c) c.textContent = covText(coverage(L.r));
  }

  /* ---------- Hoja de la palabra ---------- */
  function sheetHTML(s, v) {
    var a = audioForText(s.text) || (v && audioForVocab(v.id)) || null;
    var inSrs = !!s.items && s.items.some(function (x) { return !!state.srs[x.id]; });
    var h = '<p class="eyebrow">' + (s.text.indexOf(" ") > 0 ? "Frase" : "Palabra") + "</p>" +
      '<div class="lec-sh-head"><h2 id="lec-w-title" class="m" lang="yua">' + esc(s.text) + "</h2>" + (a ? auBtn(a, s.text, "md") : "") + "</div>";
    if (v) {
      h += '<p class="lec-gloss">' + esc(v.es) + "</p>";
      if (normalize(v.m) !== normalize(s.text)) h += '<p class="muted">Forma del curso: ' + m(v.m) + "</p>";
      h += confBadge(v) + '<p class="lec-where muted">Del curso: Unidad ' + v.unit.n + " · Lección " + (v.lesson.index + 1) + (unitKnown(s) ? " · ya la conoces" : "") + "</p>";
    } else h += '<p class="lec-gloss muted">Esta palabra aún no tiene glosa en el curso.</p>';
    h += '<div class="modal-actions">';
    if (v) h += '<button class="btn primary wide" type="button" id="lec-save" data-act="save"' + (inSrs ? " disabled" : "") + ">" + (inSrs ? "Ya está en tu repaso" : "Guardar para repasar") + "</button>";
    return h + '<button class="btn text" type="button" id="lec-close" data-act="sheet-close">Cerrar</button></div>';
  }
  function openWord(i, j, opener) {
    var ln = L.lines[i], s = ln && segs(ln)[j];
    if (!s || !s.w) return;
    var v = s.items ? pickItem(s.items) : null;
    L.sheet = { s: s, v: v, opener: opener || null };
    $("#lec-modal", L.sheetEl).innerHTML = sheetHTML(s, v);
    L.sheetEl.hidden = false;
    var f = $("#lec-save:not([disabled])", L.sheetEl) || $("#lec-close", L.sheetEl);
    if (f) f.focus({ preventScroll: true });
  }
  function closeSheet(quiet) {
    if (!L.sheet) return;
    var op = L.sheet.opener;
    L.sheet = null; L.sheetEl.hidden = true;
    if (!quiet && op && document.contains(op)) op.focus({ preventScroll: true });
  }
  // «Guardar para repasar»: alta en el repaso solo si no estaba (nunca se duplica).
  function saveWord() {
    var sh = L.sheet;
    if (!sh || !sh.v) return;
    var already = sh.s.items.some(function (x) { return !!state.srs[x.id]; });
    if (!already && srsEnroll(sh.v.id, today())) {
      save(); L.dirty = true; updateBadge();
      toast("Guardada para repasar: «" + sh.s.text + "»");
    }
    var b = $("#lec-save", L.sheetEl);
    if (b) { b.disabled = true; b.textContent = "Ya está en tu repaso"; }
    var c = $("#lec-close", L.sheetEl);
    if (c) c.focus({ preventScroll: true });
    refreshWords();
  }

  /* ---------- Audio de las líneas: tocar una línea y «Escucha y sigue» ---------- */
  // Un solo reproductor para toda la app (playAudio llama antes a stopAudio): nunca suenan dos audios a la vez.
  // Escuchamos sus eventos para avanzar al terminar un audio y para soltar el resaltado si lo interrumpen.
  function ensureHooks() {
    var p = auPlayer();
    if (!p || p.kooxLec) return;
    p.kooxLec = true;
    p.addEventListener("playing", function () {
      if (L.open && L.active >= 0 && nowKey !== L.activeKey) { stopFollow(false); }   // empezó otro audio
    });
    p.addEventListener("pause", function () {
      if (L.open && player && player.paused && !player.ended && (L.active >= 0 || L.follow)) stopFollow(false);   // lo detuvieron
    });
    p.addEventListener("ended", function () {
      if (!L.open) return;
      var f = L.follow;
      if (!f) { clearActive(); return; }
      f.k++;
      stepFollow();
    });
    p.addEventListener("error", function () {
      if (!L.open) return;
      var f = L.follow;
      if (f) { f.k++; stepFollow(); } else clearActive();
    });
  }
  function clearActiveMark() {
    if (L.root) $$(".lec-row.is-active", L.root).forEach(function (r) { r.classList.remove("is-active"); r.removeAttribute("aria-current"); });
  }
  function clearActive() { clearActiveMark(); L.active = -1; L.activeKey = ""; clearTimeout(L.wd); }
  function reveal(row) {
    if (!row || !L.root) return;
    var a = row.getBoundingClientRect(), v = L.root.getBoundingClientRect();
    if (a.top >= v.top + 72 && a.bottom <= v.bottom - 24) return;
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { row.scrollIntoView({ block: "center", behavior: calm ? "auto" : "smooth" }); } catch (e) { row.scrollIntoView(); }
  }
  function setActive(i, key) {
    clearActiveMark();
    L.active = i; L.activeKey = key || "";
    var row = rowEl(i);
    if (row) { row.classList.add("is-active"); row.setAttribute("aria-current", "true"); reveal(row); }
    L.log.push(i);
    if (L.log.length > 200) L.log.shift();
    // Si el audio nunca empieza (bloqueado o roto), no deja la línea resaltada para siempre.
    clearTimeout(L.wd);
    var s0 = auStats.started;
    L.wd = setTimeout(function () { if (L.active === i && auStats.started === s0) stopFollow(false); }, 3500);
  }
  function playLine(i) {
    var ln = L.lines[i], a = ln && audioForText(ln.m);
    if (!a) return false;
    ensureHooks();
    var row = rowEl(i);
    setActive(i, a.key);
    if (!playAudio(a, { btn: row ? $(".au-btn", row) : null })) { clearActive(); return false; }
    return true;
  }
  function playLineUser(i) {   // tocar el cuerpo de una línea; sin audio no pasa nada
    var ln = L.lines[i];
    if (!ln || !audioForText(ln.m)) return;
    stopFollow(false);
    playLine(i);
  }
  function followUI(on) {
    var b = L.root && $("#lec-follow", L.root);
    if (!b) return;
    b.classList.toggle("is-on", on);
    b.innerHTML = (on ? IC.stop + "Detener" : ICON.speaker + "Escucha y sigue");
  }
  function startFollow() {
    var seq = [];
    L.lines.forEach(function (ln, i) { if (audioForText(ln.m)) seq.push(i); });
    if (!seq.length) return;
    L.log = [];
    L.follow = { seq: seq, k: 0 };
    followUI(true);
    stepFollow();
  }
  function stepFollow() {
    var f = L.follow;
    if (!f) return;
    while (f.k < f.seq.length) {
      if (playLine(f.seq[f.k])) return;
      f.k++;
    }
    stopFollow(false);   // terminó la página
  }
  // Detiene el seguimiento y quita el resaltado; con stopAud también corta el audio que esté sonando.
  function stopFollow(stopAud) {
    var had = !!L.follow;
    L.follow = null;
    followUI(false);
    clearActive();
    if (had && stopAud) stopAudio();
  }

  /* ---------- Clics ---------- */
  function onClick(e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var au = t.closest("[data-au]");
    if (au) {   // botón de audio: el núcleo reproduce; aquí solo se resalta la línea
      ensureHooks();
      var row = au.closest(".lec-row");
      if (row) { stopFollow(false); setActive(Number(row.getAttribute("data-i")), au.getAttribute("data-au")); }
      return;
    }
    var b = t.closest("[data-act]");
    if (b) {
      var a = b.getAttribute("data-act");
      if (a === "back") goBack();
      else if (a === "open") openReader(b.getAttribute("data-id"));
      else if (a === "word") openWord(Number(b.getAttribute("data-i")), Number(b.getAttribute("data-j")), b);
      else if (a === "follow") { if (L.follow) stopFollow(true); else startFollow(); }
      else if (a === "finish") finish();
      else if (a === "prev") turnPage(-1);
      else if (a === "next") turnPage(1);
      else if (a === "save") saveWord();
      else if (a === "sheet-close") closeSheet();
      return;
    }
    var bub = t.closest(".lec-bubble"), r2 = bub && bub.closest(".lec-row");
    if (r2) playLineUser(Number(r2.getAttribute("data-i")));
  }

  /* ---------- Ganchos del núcleo ---------- */
  registerModule({
    homeTop: function () {
      if (!readings().length) return "";
      return '<button class="guide-link card" type="button" id="btn-home-readings">' + IC.book +
        '<span class="gl-txt"><span class="gl-t">Lecturas</span><span class="gl-s">Lee en maya y toca las palabras para entenderlas</span></span></button>';
    },
    profile: function () {
      var rs = readings();
      if (!rs.length) return "";
      var n = rs.filter(function (r) { return doneOf(r.id); }).length;
      return '<section class="section" id="lec-prof" aria-label="Lecturas leídas"><p><span class="muted">Lecturas leídas:</span> <b class="num">' + n + '</b> <span class="muted">de ' + rs.length + "</span></p></section>";
    },
    bind: function (root, where) {
      if (where !== "home") return;
      var b = $("#btn-home-readings", root);
      if (b) b.addEventListener("click", openList);
    }
  });

  // Para las pruebas (test/lecturas.cjs): lo que hay y lo que se ve, sin tocar el estado.
  if (window.__koox) window.__koox.lecturas = {
    list: function () {
      return readings().map(function (r) { var c = coverage(r); return { id: r.id, kind: r.kind, title: r.title, lines: r.nLines, pages: r.pages.length, total: c.total, known: c.known, pct: c.pct }; });
    },
    segments: function (text) {
      return segs({ m: String(text) }).map(function (s) { return s.w ? { w: s.text, ids: s.items ? s.items.map(function (v) { return v.id; }) : null } : { p: s.text }; });
    },
    view: function () {
      return { open: L.open, view: L.view, id: L.r ? L.r.id : null, page: L.page, sheet: !!L.sheet, active: L.active, follow: !!L.follow, log: L.log.slice() };
    }
  };
})();

  /* ---- módulo logros.js ---- */
/* ================= Logros «Puedo…» ================= */
// Cuando una unidad tiene todas sus lecciones completas y su «Repaso de la unidad» se aprueba con 80 % o más, se abre
// su insignia «Puedo» y, en Perfil, la lista de lo que ya se puede hacer en maya. Los enunciados salen de
// window.COURSE_CANDO (src/content/puedo.js); la forma maya de cada ejemplo, del propio curso, nunca de ese archivo.
// Solo unidades: no hay logros por volumen, por racha ni secretos, y nada se pierde ni caduca.
// Estado propio (state.x.logros), saneado en cada lectura y creado solo cuando hay algo que guardar:
//   units: { <id de unidad>: { best, at } }  mejor % del repaso de la unidad (cuenta solo si la unidad ya estaba completa)
//   cando: { <id de unidad>: "AAAA-MM-DD" }  día en que se abrió la insignia
// Se evalúa al arrancar, al abrir Inicio o Perfil y al terminar cada sesión (por si una copia importada ya cumplía).
(function () {
  var PASS = 80; // % mínimo del repaso de la unidad
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  var ID = /^[a-z0-9-]{1,24}$/;
  var own = Object.prototype.hasOwnProperty;
  var last = null; // { info, fresh }: lo que abrió la última sesión (results lo lee justo después de session)

      '<p class="muted ml-when">' + when + " Unidad " + p.v.unit.n + ".</p>" +
      '<div class="modal-actions"><button class="btn text" type="button" id="ml-close" data-act="sheet-close">Cerrar</button></div>';
  }
  function openSheet(id, opener) {
    var p = M.list.filter(function (x) { return x.v.id === id; })[0];
    if (!p) return;
    M.sheet = { id: id, opener: opener || null };
    $("#ml-modal", M.sheetEl).innerHTML = sheetHTML(p);
    M.sheetEl.hidden = false;
    var f = $("#ml-close", M.sheetEl);
    if (f) f.focus({ preventScroll: true });
  }
  function closeSheet(quiet) {
    if (!M.sheet) return;
    var op = M.sheet.opener;
    M.sheet = null; M.sheetEl.hidden = true;
    if (!quiet && op && document.contains(op)) op.focus({ preventScroll: true });
  }
  function goBack() { if (M.sheet) closeSheet(); else closeView(false); }
  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var a = t.getAttribute("data-act");
    if (a === "back") goBack();
    else if (a === "sheet-close") closeSheet();
    else if (a === "harvest") harvest();
    else if (a === "plant") openSheet(t.getAttribute("data-id"), t);
  }
  window.addEventListener("popstate", function () {
    if (!M.open) return;
    if (M.sheet) { closeSheet(); histPush("milpa"); return; }
    closeView(true);
  });
  document.addEventListener("visibilitychange", function () {
    // El núcleo repinta la pestaña al volver (otro día puede haber más listas): la vista sigue encima, al día.
    if (M.open && document.visibilityState === "visible") { screen = "milpa"; if (!M.sheet) render(); }
  });
  document.addEventListener("keydown", function (e) {
    if (!M.open || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "Escape") { e.preventDefault(); goBack(); }
    else if (e.key === "Tab") trapFocus(e, M.sheet ? M.sheetEl : M.root);
  });

  /* ---------- Ganchos del núcleo ---------- */
  registerModule({
    homeTop: function () {
      var ps = plants(), s = summary(ps);
      var sub = s.total ? esc(countText(s)) : "Siembra tu milpa: termina una lección y aparecerá tu primera planta";
      var label = s.total ? "Mi milpa: " + countText(s) + ". Abrir la vista completa" : "Mi milpa: todavía sin plantas. Abrir";
      return '<button class="guide-link card ml-card gami" type="button" id="btn-home-milpa" aria-label="' + esc(label) + '">' +
        '<span class="gl-txt"><span class="gl-t">Mi milpa</span><span class="gl-s">' + sub + "</span>" + (s.total ? miniRow(ps) : "") + "</span></button>";
    },
    profile: function () {
      var s = summary(plants());
      var h = '<section class="section ml-prof" id="milpa" aria-labelledby="milpa-title"><h2 id="milpa-title">Mi milpa</h2>';
      if (!s.total) h += '<p class="muted">Siembra tu milpa: termina una lección y aparecerá tu primera planta.</p>';
      else h += '<p class="ml-sum">' + esc(countText(s)) + "</p>" + stageList(s);
      return h + '<div class="btn-row"><button class="btn tonal" type="button" id="btn-profile-milpa">Ver mi milpa</button></div></section>';
    },
    bind: function (root, where) {
      var b = $(where === "home" ? "#btn-home-milpa" : "#btn-profile-milpa", root);
      if (b) b.addEventListener("click", function () { openView(b); });
    }
  });

  // Para las pruebas (test/milpa.cjs): lo que se dibuja, sin tocar el estado.
  if (window.__koox) window.__koox.milpa = {
    plants: function () { return plants().map(function (p) { return { id: p.v.id, kind: p.kind.k, stage: p.stage, ready: p.ready }; }); },
    summary: function () { return summary(plants()); },
    view: function () { return { open: M.open, sheet: M.sheet ? M.sheet.id : null }; }
  };
})();

  /* ---- módulo voces.js ---- */
/* ================= Voces ================= */
// Perfil → «Voces»: cuántas palabras del curso tienen voz de un hablante (audio «nativo» en window.COURSE_AUDIO),
// cuántas solo voz sintética (aproximada) y quiénes grabaron, con su región. Es información y una invitación a
// grabar, no un marcador: sin metas, sin avisos. Sin catálogo de audio muestra 0 y el mismo mensaje amable.
(function () {
  var ANON = "Hablante anónimo";

  function stats() {
    var nat = 0, syn = 0, groups = [], index = {};
    // Igual que audioForVocab: el audio enlazado por id o el que dice exactamente la palabra del curso.
    COURSE.vocab.forEach(function (v) {
      var n = false, s = false;
      arr(AU.byVocab[v.id]).concat(textAudios(v.m)).forEach(function (a) { if (a.kind === "nativo") n = true; else if (a.kind === "sintetico") s = true; });
      if (n) nat++; else if (s) syn++; // con voz nativa, la sintética nunca se muestra: no se cuenta aparte
    });
    AU.list.forEach(function (a) {
      if (a.kind !== "nativo") return;
      var who = a.speaker || a.author || ANON, key = normalize(who) + "|" + normalize(a.region), g = index[key];
      if (!g) { g = index[key] = { who: who, region: a.region, n: 0 }; groups.push(g); }
      g.n++;
    });
    return { total: COURSE.vocab.length, native: nat, synthetic: syn, speakers: groups };
  }

  registerModule({
    profile: function () {
      var s = stats();
      if (!s.total) return "";
      var pct = Math.round(s.native / s.total * 100);
      var link = window.KOOX_STANDALONE === true && window.KOOX_GRABAR === true; // el enlace solo existe en el sitio web con grabar.html
      var h = '<section class="section vz-sec" id="voces" aria-labelledby="voces-title"><h2 id="voces-title">Voces</h2>' +
        '<p class="muted">Las grabaciones de hablantes de maya son la mejor guía para pronunciar. Así van las del curso.</p>' +
        '<p class="vz-count"><span class="vz-n num">' + s.native + "</span> de <span class=\"num\">" + s.total + "</span> " +
        plural(s.total, "palabra", "palabras") + " con voz nativa</p>" +
        '<div class="bar yaax" role="progressbar" aria-label="Palabras con voz nativa" aria-valuemin="0" aria-valuemax="' + s.total + '" aria-valuenow="' + s.native +
        '"><span style="width:' + (s.native ? Math.max(2, pct) : 0) + '%"></span></div>';
      if (s.synthetic) h += '<p class="vz-synth">' + s.synthetic + " " + plural(s.synthetic, "palabra más tiene", "palabras más tienen") +
        " voz sintética. Es una voz aproximada: la genera una IA y puede equivocarse en el tono y el saltillo.</p>";
      h += '<h3 class="vz-sub">Voces nativas</h3>';
      if (s.speakers.length) {
        h += '<ul class="vz-list">' + s.speakers.map(function (g) {
          return '<li><span class="vz-who">' + esc(g.who) + '</span><span class="vz-meta muted">' + (g.region ? esc(g.region) + " · " : "") +
            g.n + " " + plural(g.n, "grabación", "grabaciones") + "</span></li>";
        }).join("") + "</ul>";
      } else h += '<p class="vz-empty">Todavía no hay voz nativa en el curso. Cada grabación cuenta.</p>';
      h += '<div class="vz-help"><p>' + (link ? "Si el maya es tu lengua, puedes grabar las palabras del curso." :
        "<strong>¿Hablas maya? Ayuda a grabar.</strong> Si el maya es tu lengua, puedes grabar las palabras del curso en la versión web de Ko'ox Maaya.") + "</p>" +
        (link ? '<a class="btn tonal" href="grabar.html" id="vz-grabar">¿Hablas maya? Ayuda a grabar</a>' : "") + "</div></section>";
      return h;
    }
  });

  try { window.__koox.voces = stats; } catch (e) { /* un módulo no tumba la app */ }
})();

  var initial = (location.hash || "").replace("#", "");
  showTab(TAB_VIEW[initial] ? initial : "aprender");
})();

</script>
<script>
(function () {
  var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (!("serviceWorker" in navigator) || !(location.protocol === "https:" || local)) return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      var last = Date.now();
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || Date.now() - last < 30 * 60 * 1000) return;
        last = Date.now();
        reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
})();
</script>
